name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # main に Conventional Commits (feat: / fix: 等) が入るとリリース PR を作成・更新する。
  # リリース PR をマージするとタグと GitHub Release が作られる。
  #
  # 既定の GITHUB_TOKEN で作ったリリース PR では CI (pull_request) が起動しない (GitHub の仕様)。
  # main に必須チェックを設定していないのでマージは止まらず、リリース PR の差分は
  # CHANGELOG とバージョンのみ。マージ後の main への push で CI が走る。
  # リリース PR でも CI を走らせたい場合は、PAT か GitHub App のトークンを secret に登録し
  # with.token に渡す (https://github.com/googleapis/release-please-action#other-actions-on-release-please-prs)。
  # main に必須チェックを設定する場合は、この対応が必要になる。
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  # Release が作られたときだけ、ビルド済みバイナリを Release に添付する
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
